name: Build Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub release as prerelease"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Least privilege by default; only the job that creates/updates the release
# and uploads assets opts up to write.
permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref_name }}
  cancel-in-progress: false

# Every job re-asserts the same authorization guard (GitHub Actions has no shared
# anchors) as defense-in-depth: only WebbinRoot, on NetSPI/oci-lexer-parser, on refs/heads/main.
jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'NetSPI/oci-lexer-parser' &&
      github.actor == 'WebbinRoot' &&
      github.triggering_actor == 'WebbinRoot' &&
      github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: oci-lexer-parse-linux-x64
            ext: ""
          - os: macos-latest
            artifact: oci-lexer-parse-macos-x64
            ext: ""
          - os: windows-latest
            artifact: oci-lexer-parse-windows-x64.exe
            ext: ".exe"

    steps:
      # v6.0.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      # v6.2.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install -U pip
          python -m pip install .
          python -m pip install "pyinstaller==6.22.0"

      - name: Build binary
        run: |
          pyinstaller --onefile --name oci-lexer-parse scripts/pyinstaller_entry.py

      - name: Rename artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mv dist/oci-lexer-parse${{ matrix.ext }} dist/${{ matrix.artifact }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Rename-Item -Path "dist/oci-lexer-parse${{ matrix.ext }}" -NewName "${{ matrix.artifact }}"

      - name: Smoke-test compiled binary against the CLI test suite
        # Every test in test_cli.py runs the CLI as a subprocess already;
        # OCI_LEXER_PARSE_BIN repoints those subprocess calls at the just-built
        # standalone binary instead of "python -m oci_lexer_parser.cli", so this
        # validates the actual shipped artifact on each of the 3 platforms.
        env:
          OCI_LEXER_PARSE_BIN: ${{ github.workspace }}/dist/${{ matrix.artifact }}
        run: |
          python -m pip install pytest
          python -m pytest src/tests/test_cli.py -v

      - name: Upload artifact
        # v7.0.0
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'NetSPI/oci-lexer-parser' &&
      github.actor == 'WebbinRoot' &&
      github.triggering_actor == 'WebbinRoot' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    steps:
      # v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          PRERELEASE_FLAG=()
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG+=(--prerelease)
          fi

          # download-artifact (no `name` filter) lays assets out one directory
          # per artifact under dist/ (dist/oci-lexer-parse-linux-x64/..., etc) --
          # one level deep, so a plain dist/*/* glob (no globstar needed) covers it.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" "${PRERELEASE_FLAG[@]}"
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_TARGET" --title "$RELEASE_TAG" --generate-notes "${PRERELEASE_FLAG[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/*/* --clobber
