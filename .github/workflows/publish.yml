name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Target repository"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
      run_tests:
        description: "Run test suite before publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'NetSPI/oci-lexer-parser' &&
      github.actor == 'WebbinRoot' &&
      github.triggering_actor == 'WebbinRoot' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Trusted publishing: the per-repository environment scopes the OIDC identity.
    environment: ${{ inputs.repository }}
    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # v6.2.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Run tests
        if: ${{ inputs.run_tests }}
        run: |
          python -m pip install .[dev]
          python -m pytest -q -m "not generate_json"

      - name: Build dist
        run: python -m build

      - name: Publish to PyPI
        if: ${{ inputs.repository == 'pypi' }}
        # v 1.14.0
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086

      - name: Publish to TestPyPI
        if: ${{ inputs.repository == 'testpypi' }}
        # v1.14.0
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          repository-url: https://test.pypi.org/legacy/
